# Git Branching Workflow Extension Configuration
# Copied to .specify/extensions/git/git-config.yml on install

# Branch numbering strategy: "sequential" (001, 002, ...) or "timestamp" (YYYYMMDD-HHMMSS)
branch_numbering: sequential

# Optional branch name template. Leave empty for the default "{number}-{slug}".
# Supported tokens: {author}, {app}, {number}, {slug}
# {slug} must not appear before {number}; final path segment must start with {number}-.
# Example for monorepos: "{author}/{app}/{number}-{slug}"
branch_template: ""

# Optional shorthand namespace. Leave empty to use branch_template/default behavior.
# Example: "features/{app}" expands to "features/{app}/{number}-{slug}"
branch_prefix: ""

# Commit message used by `git commit` during repository initialization
init_commit_message: "[Spec Kit] Commit inicial"

# Commit message style used by auto-commit hooks (speckit.git.commit):
# "fixed"        - default; use the configured/static messages below.
# "conventional" - ask the agent to inspect the diff and generate a
#                  Conventional Commit message (e.g. "feat: add OAuth spec")
#                  instead of using the messages configured below.
commit_style: fixed

# Auto-commit before/after core commands.
# Set "default" to enable for all commands, then override per-command.
# Each key can be true/false. Message is customizable per-command.
auto_commit:
  default: false
  before_clarify:
    enabled: false
    message: "[Spec Kit] Guarda avance antes de aclarar"
  before_plan:
    enabled: false
    message: "[Spec Kit] Guarda avance antes de planear"
  before_tasks:
    enabled: false
    message: "[Spec Kit] Guarda avance antes de generar tareas"
  before_implement:
    enabled: false
    message: "[Spec Kit] Guarda avance antes de implementar"
  before_checklist:
    enabled: false
    message: "[Spec Kit] Guarda avance antes de la lista de revisión"
  before_analyze:
    enabled: false
    message: "[Spec Kit] Guarda avance antes del análisis"
  before_taskstoissues:
    enabled: false
    message: "[Spec Kit] Guarda avance antes de sincronizar issues"
  after_constitution:
    enabled: false
    message: "[Spec Kit] Agrega la constitución del proyecto"
  after_specify:
    enabled: false
    message: "[Spec Kit] Agrega la especificación"
  after_clarify:
    enabled: false
    message: "[Spec Kit] Aclara la especificación"
  after_plan:
    enabled: false
    message: "[Spec Kit] Agrega el plan de implementación"
  after_tasks:
    enabled: false
    message: "[Spec Kit] Agrega las tareas"
  after_implement:
    enabled: false
    message: "[Spec Kit] Avance de implementación"
  after_checklist:
    enabled: false
    message: "[Spec Kit] Agrega la lista de revisión"
  after_analyze:
    enabled: false
    message: "[Spec Kit] Agrega el reporte de análisis"
  after_taskstoissues:
    enabled: false
    message: "[Spec Kit] Sincroniza tareas con issues"
