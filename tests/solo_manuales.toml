# Criterios que necesitan a una persona además (o en lugar) de su test automático.
# test_trazabilidad.py exige que cada entrada tenga "justificacion" y exista en spec.md.

[CA-003]
justificacion = "La parte con 10 personas nuevas, sin instrucciones (quickstart parte B), no se puede automatizar; el test automático de T020 solo comprueba el foco inicial y que la app responde antes de cargar los modelos."
paso_quickstart = "Prueba con personas nuevas"

[CA-001]
justificacion = "Entender el sentido de 8 de 10 frases lo juzga una persona (quickstart B4); el test automático solo comprueba que hay traducción."
paso_quickstart = "B4"

# Los siguientes tienen test automático con simulaciones o WAV; la entrada documenta la
# confirmación a mano con fuentes reales (T075).
[CA-002]
justificacion = "El test mide la latencia con WAV; la persona la confirma con un video real contando los segundos."
paso_quickstart = "B5"

[CA-004]
justificacion = "El test usa un canal falso; la persona confirma que los subtítulos desaparecen en menos de 1 s con la app real."
paso_quickstart = "B13"

